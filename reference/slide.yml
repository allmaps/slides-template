# Slide frontmatter reference for Allmaps Slides (2026-10-01).
# Copy selected fields between --- lines at the top of a Markdown slide.
# This file is not a slide and is not loaded automatically.
# title is required (EXAMPLE below); all other fields are optional.
# Commented EXAMPLES have no fixed default. Do not enable them all.
# Environment placeholders are NOT expanded in Markdown frontmatter.

title: My slide
# description: "" # Default: unset; used in chapter metadata.

location: {}
# center: omitted => fit warped maps, otherwise keep previous center.
# zoom: omitted => fit warped maps, otherwise keep previous zoom.
# bearing: omitted => use a map marked useBearing, otherwise 0 when fitting maps,
# or keep the previous bearing when there are no maps.
# Initial camera before map fitting: center [0, 0], zoom 14, bearing 0.
# EXAMPLE (replace location):
# location:
#   center: [4.897004, 52.3691733] # [longitude, latitude]
#   zoom: 15
#   bearing: 0 # Clockwise degrees.
#   duration: 4000 # Default flight duration in milliseconds; the initial view
#   # is immediate. The app currently treats 0 as the default.

fit: contain # contain | cover | equal; used when automatically fitting map bounds.
# contain shows all bounds; cover fills the available map area with cropping;
# equal gives the bounds the same area as the available viewport.
# Applies to the live view and generated previews. useZoom overrides fitted zoom;
# an explicit location.zoom takes priority over both.

# padding: 25 # Optional uniform inner margin in pixels; negative values are allowed.
# Omitted: 25 in the live view, 20 in slide previews, 32 in sharing images.
# Added inside the space left by the interface; cannot change layout reservations.
# Use fit: cover with padding: 0 to fill that area without an extra margin.
# Negative values (e.g. -20) zoom in for extra cropping; the layout center stays fixed.
# The temporary "Show full map" view always uses the normal 25-pixel margin.

hideBasemap: false # Set true to hide the basemap for this slide.
map: {} # Inherits project/slideshow map settings.
# Accepts every field in slides.config.yml's map block: theme, styles,
# labels.visible/position, hiddenLayers, foreground.light/dark and protomaps.
# Defaults depend on the parent scopes; copy only fields you want to override.

warpedMaps: [] # No maps. A single object is also accepted instead of an array.
# EXAMPLE (replace []):
#   - url: https://annotations.allmaps.org/maps/e9aa6ec10276bf65@d2d0044d129ea2d5
#     # url OR path is required; url wins if both are supplied.
#     # path: assets/annotations/map.json # Local alternative, content-root relative.
#     # caption: My map # Default: label derived from homepage/url, then Map layer N.
#     # provenance: Collection name # Default: host from homepage/url, then
#     # "Georeference annotation".
#     # homepage: https://example.org/object # Default: unset; original source link.
#     useBearing: false # Take orientation from this map's first annotation.
#     useBounds: false # If any maps opt in, only those determine automatic bounds;
#     # otherwise all maps do. Explicit location values override automatic fitting.
#     useZoom: false # Derive zoom from resource scale; explicit zoom takes priority.
#     options: {} # App + renderer defaults: see warped-map-options.yml.
#     darkOptions: {} # Merged over options only in dark interface mode.
# Each slide supplies its own map list; maps do not carry over automatically.
# For zoomable images without georeferencing, use IIIF figures in the slide text.

layers: [] # Use the global layer defaults from slides.config.yml.
# EXAMPLE: {source-id}-fill | -line | -point-circle | -point-symbol.
#   - layer: route-line # Required existing layer id, without the user- prefix.
#     opacity: 1 # EXAMPLE, 0..1; omitted uses the global layer's paint opacity.
#     visibility: visible # EXAMPLE: visible | none; omitted uses the global default.
#     duration: 300 # EXAMPLE, non-negative milliseconds; omitted uses the global
#     # transition or MapLibre default. Overrides apply only to this slide.
# Custom layers use their id, e.g. layer: historic-building-labels.

subslideshows: [] # No linked slideshows; a single id/object is also accepted.
# EXAMPLES (must match an id in slides.config.yml):
#   - history
#   - id: details
#     title: Read more # Optional label, defaults to that slideshow's title.

# sprite: # Default: unset. Advanced prebuilt image sprites; all fields required.
#   json: https://example.org/sprites.json
#   image: https://example.org/sprites.jpg
#   dimensions: [4096, 4096] # EXAMPLE [width, height] in pixels.
# Sprite chapters cannot generate thumbnails in the current renderer.
